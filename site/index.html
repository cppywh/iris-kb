<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris 安全知识库</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="side-head">
      <div class="brand">
        <span class="mark">I</span>
        <div>
          <h1>Iris 安全知识库</h1>
          <p id="stat-line">正在加载…</p>
        </div>
      </div>
      <button id="theme-toggle" type="button" class="icon-btn" title="切换主题">◐</button>
    </header>

    <div class="side-search">
      <input id="q" type="search" placeholder="标题 / 别名 / 标签 / CVE" autocomplete="off" spellcheck="false">
      <button id="clear" type="button" title="清空">×</button>
    </div>

    <div class="scope-row">
      <span id="scope-label">范围：全部知识</span>
      <button id="scope-reset" type="button" hidden>返回全库</button>
    </div>

    <div class="side-body">
      <nav id="dir-tree" class="dir-tree" aria-label="知识目录"></nav>
      <ol id="results" class="results" hidden></ol>
    </div>

    <div id="side-detail" class="side-detail">
      <p class="hint">单击枝干节点收窄范围，双击放大；点外圈星点打开卡片。</p>
    </div>
  </aside>

  <main class="stage">
    <canvas id="world" aria-label="知识宇宙树"></canvas>
    <div class="stage-tools">
      <button id="zoom-in" type="button" title="放大">＋</button>
      <button id="zoom-out" type="button" title="缩小">－</button>
      <button id="fit" type="button" title="适应全图">适配</button>
    </div>
    <div id="hover-tip" class="hover-tip" hidden></div>
  </main>

  <aside id="reader" class="reader" hidden>
    <header class="reader-head">
      <span id="reader-crumb">场景手记</span>
      <button id="reader-close" type="button" title="关闭">×</button>
    </header>
    <div class="reader-scroll" tabindex="0">
      <div id="reader-meta" class="reader-meta"></div>
      <article id="article" class="article"></article>
    </div>
  </aside>
</div>

<script src="world.js"></script>
<script src="app.js"></script>
</body>
</html>
